<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="自动播放的照片相册">
  <link rel="icon" href="data:,">
  <title>相册，打开看看</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
    }
    #container {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 500px;
      height: 815px;
      margin-left: -250px;
      margin-top: -407.5px;
      overflow: hidden;
      transform: scale(var(--stage-scale, 1));
      transform-origin: center;
    }
    .photo {
      position: absolute;
      top: 219px;
      left: 107px;
      width: 285px;
      height: 377px;
      padding: 15px;
      background: #f7f4ed;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .55);
      opacity: 0;
      pointer-events: none;
    }
    .photo.landscape {
      top: 265px;
      left: 61px;
      width: 377px;
      height: 285px;
    }
    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .photo.first.playing { animation: kuangmove 10s linear both; }
    .photo.second.playing { animation: kuangmove1 10s linear both; }
    @keyframes kuangmove {
      0% { opacity: 0; transform: translate(-510px, 250px) rotate(-70deg); }
      15% { opacity: 1; }
      50%, 70% { opacity: 1; transform: translate(0, 0) rotate(-8deg); }
      100% { opacity: 0; transform: translate(510px, 270px) rotate(50deg); }
    }
    @keyframes kuangmove1 {
      0% { opacity: 0; transform: translate(510px, 250px) rotate(70deg); }
      15% { opacity: 1; }
      50%, 70% { opacity: 1; transform: translate(0, 0) rotate(8deg); }
      100% { opacity: 0; transform: translate(-510px, 270px) rotate(-50deg); }
    }
    #status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      color: #eee;
      font: 16px/1.5 sans-serif;
    }
    #status[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .photo.first.playing, .photo.second.playing { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main id="container" aria-label="照片轮播">
    <div class="photo first"><img alt="相册照片"></div>
    <div class="photo second"><img alt="相册照片"></div>
    <p id="status" hidden role="status">照片暂时无法加载</p>
  </main>
  <script>
    (function () {
      'use strict';
      const albumName = (new URLSearchParams(location.search).get('username') || '').trim().slice(0, 30);
      if (albumName) document.title = albumName + '的相册';

      const frames = Array.from(document.querySelectorAll('.photo'));
      const status = document.getElementById('status');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let photos = [];
      let index = 0;
      let timer;

      function fitStage() {
        const scale = Math.min(1, document.documentElement.clientWidth / 500,
          document.documentElement.clientHeight / 815);
        document.getElementById('container').style.setProperty('--stage-scale', scale);
      }

      function showNext() {
        const frame = frames[index % frames.length];
        const photo = photos[index % photos.length];
        if (reducedMotion) frames.forEach(function (item) { item.classList.remove('playing'); });
        frame.classList.remove('playing');
        frame.classList.toggle('landscape', photo.width / photo.height > 1.2);
        frame.querySelector('img').src = photo.src;
        frame.querySelector('img').alt = '相册照片 ' + ((index % photos.length) + 1);
        void frame.offsetWidth;
        frame.classList.add('playing');
        index++;
      }

      function loadPhoto(src) {
        return new Promise(function (resolve) {
          const image = new Image();
          image.onload = function () {
            resolve({ src: src, width: image.naturalWidth, height: image.naturalHeight });
          };
          image.onerror = function () { resolve(null); };
          image.src = src;
        });
      }

      fitStage();
      addEventListener('resize', fitStage);
      fetch('./images.json').then(function (response) {
        if (!response.ok) throw new Error('图片清单加载失败');
        return response.json();
      }).then(function (manifest) {
        const sources = Array.isArray(manifest.images) ? manifest.images.filter(function (src) {
          return typeof src === 'string';
        }) : [];
        return Promise.all(sources.map(loadPhoto));
      }).then(function (results) {
        photos = results.filter(Boolean);
        if (!photos.length) {
          status.hidden = false;
          return;
        }
        showNext();
        timer = setInterval(showNext, 7000);
      }).catch(function () {
        status.hidden = false;
      });
      addEventListener('pagehide', function () { clearInterval(timer); });
      addEventListener('pageshow', function (event) {
        if (event.persisted && photos.length) {
          showNext();
          timer = setInterval(showNext, 7000);
        }
      });
    })();
  </script>
</body>
</html>
