<!DOCTYPE HTML>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cool Clock</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" type="text/css" href="cool.clock.css">
<script type="text/javascript" src="cool.clock.js"></script>
<!-- +++ 可注释部分-开始 +++ -->
<style type="text/css">*{margin:0;padding:0;}html,body{width:100%;height:100%;overflow:hidden;}body{background-color:#ddd;}</style>
<script type="text/javascript">
//<![CDATA[
function DynamicStyle(ID) {
    var BrowserWidth = document.documentElement.clientWidth;
    var BrowserHeight = document.documentElement.clientHeight;
    var itWidth = document.getElementById(ID).clientWidth;
    var itHeight = document.getElementById(ID).clientHeight;
    var NewMarginTop = (BrowserHeight-itHeight)/2 > 0 ? (BrowserHeight-itHeight)/2 : 0;
    var NewMarginLeft = (BrowserWidth-itWidth)/2 > 0 ? (BrowserWidth-itWidth)/2 : 0;
    document.getElementById(ID).style.marginTop = NewMarginTop + "px";
    document.getElementById(ID).style.marginLeft = NewMarginLeft + "px";
}

window.onload = function() {
    DynamicStyle("clock-layer");
    if (document.getElementById("ring")) DynamicStyle("ring"); //请同时启用ring的HTML和CSS。
}
window.onresize = function() {
    DynamicStyle("clock-layer");
    if (document.getElementById("ring")) DynamicStyle("ring"); //请同时启用ring的HTML和CSS。
}
window.onscroll = function() {
    DynamicStyle("clock-layer");
    if (document.getElementById("ring")) DynamicStyle("ring"); //请同时启用ring的HTML和CSS。
}
//]]>
</script>
<!-- +++ 可注释部分-结束 +++ -->
</head>
<body>
<div id="clock-layer">
    <div id="clock">
        <div id="tick-mark">
            <div id="mark1"></div>
            <div id="mark2"></div>
            <div id="mark4"></div>
            <div id="mark5"></div>
            <div id="mark7"></div>
            <div id="mark8"></div>
            <div id="mark10"></div>
            <div id="mark11"></div>
            <div id="mark3">3</div>
            <div id="mark6">6</div>
            <div id="mark9">9</div>
            <div id="mark12">12</div>
        </div>
        <div id="hourHand-layer">
            <div id="hourHand"></div>
        </div>
        <div id="minuteHand-layer">
            <div id="minuteHand"></div>
        </div>
        <div id="secondHand-layer">
            <div id="secondHand-m-layer">
                <div id="secondHand"></div>
            </div>
        </div>
        <div id="tack"></div>
        <div id="glass"></div>
    </div>
</div>
<!-- +++ 可注释部分-开始 +++ -->
<div id="ring">
    <div id="ring_green"></div>
    <div id="ring_purple"></div>
</div>
<style type="text/css">
#clock{
    background-color:#2e2e2e;
}
#mark1, #mark2, #mark4, #mark5, #mark7, #mark8, #mark10, #mark11{
    background:#909090;
}
#tick-mark, #hourHand-layer, #minuteHand-layer, #secondHand-layer, #tack{
    z-index:2;
}
#ring, #ring_green, #ring_purple{
    top:0px;
    left:0px;
    width:330px;
    height:330px;
    position:absolute;
    z-index:1;
}
#ring_purple{
    z-index:0;
}
#ring_green, #ring_green:before, #ring_green:after,
#ring_purple, #ring_purple:before, #ring_purple:after
{
    position:absolute;
    -webkit-border-radius:50%;
       -moz-border-radius:50%;
            border-radius:50%;
}
#ring_green:after, #ring_purple:after{
    display:block;
    content:"";
    top:0px;                 /* 圆环 内外偏移 */
    left:0px;                /* 圆环 内外偏移 */
    right:0px;               /* 圆环 内外偏移 */
    bottom:0px;              /* 圆环 内外偏移 */
    border:solid 15px green; /* 圆环宽度 颜色 */
}
#ring_purple:after{
    border:solid 26px #639;  /* 圆环宽度 颜色 */
}
</style>
<!-- +++ 可注释部分-结束 +++ -->
</body>
</html>
