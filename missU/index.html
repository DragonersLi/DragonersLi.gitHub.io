<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100c1c">
  <link rel="icon" href="data:,">
  <title>不同的团圆，相同的思念</title>
  <link rel="stylesheet" href="/missU/index.css">
  <script src="/missU/index.js" defer></script>
</head>
<body>
  <main class="wp">
    <div class="bgtt" aria-hidden="true">
      <ul class="left"><li></li><li></li><li></li><li class="bgttFadeInOut"></li></ul>
      <ul class="right"><li></li><li></li><li></li><li></li><li></li></ul>
    </div>

    <div class="center">
      <img class="pic" src="/missU/images/moon.png" alt="明月">
      <div class="moon" aria-hidden="true">
        <div class="dftxt">
          <div class="abs list_txt">
            <div class="abs dfl"><span class="time2 fadeInTxt"></span><span class="time2 fadeInTxt"></span><span class="time2 fadeInTxt"></span></div>
            <div class="abs dfr"><span class="time3 fadeIn"></span><span class="time3 fadeIn"></span><span class="time3 fadeIn"></span></div>
          </div>
          <div id="reunion" class="reunion resize"><div class="fadeInOut t4"></div></div>
        </div>
        <div class="cloud_top h0 time8 fadeInRight"></div>
        <div class="cloud_bottom h0 time8 fadeInLeft"></div>
        <div class="abs miss"><div class="abs m1 h0 time5 fadeIn"></div><div class="abs m2 h0 time5 fadeIn"></div></div>
        <div class="seal h0 time6 fadeIn"></div>
      </div>
      <div class="abs choose_txt" aria-hidden="true">
        <div class="ct1"></div>
        <ul class="ct2"><li class="time1"></li><li class="t1_1"></li><li class="t1_2"></li><li class="t1_3"></li><li class="t1_4"></li><li class="t1_5"></li></ul>
      </div>
    </div>

    <button class="abs start time6 zoomIn2" type="button" aria-label="开启动画">
      <img src="/missU/images/start.png" alt="">
    </button>
    <p class="greeting" id="greeting" hidden></p>
  </main>
</body>
</html>
